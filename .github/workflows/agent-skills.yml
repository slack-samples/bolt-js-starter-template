name: Update agent skills

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Update the skills in skills-lock.json
        run: npx --yes skills@1 update --project --yes
      - name: Open a pull request with the updates
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: |
            .agents/skills
            .claude/skills
            skills-lock.json
          branch: agent-skills
          delete-branch: true
          commit-message: "chore: update agent skills"
          title: "chore: update agent skills"
          body: "Updates the agent skills in `skills-lock.json` to the latest versions."
